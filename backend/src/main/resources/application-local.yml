# ============================================
# LOCAL PROFILE - Development on localhost
# Usage: --spring.profiles.active=local
# ============================================

spring:
  # Database - Local PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/users
    username: users_app
    password: password1
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
  
  # JPA - Show SQL for debugging
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update  # Auto-create/update schema
    properties:
      hibernate:
        format_sql: true
  
  # Redis - Local instance
  data:
    redis:
      host: localhost
      port: 6379
  
  # Development tools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Server configuration
server:
  port: 8081

# JWT - Use test secret (NEVER use in production!)
jwt:
  secret: "LOCAL_DEV_SECRET_KEY_DO_NOT_USE_IN_PRODUCTION_3ZpZuH8yU4vwf9bfbY+lF8gG9Kyj37xftmZEGzVuBBk="

# Logging - Verbose for debugging
logging:
  level:
    root: INFO
    pl.krutkowski.users: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.redis: DEBUG

# Actuator - All endpoints exposed for local testing
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# CORS - Permissive for local development
cors:
  allowed-origins: http://localhost:4200,http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true
