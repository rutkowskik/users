services:
  redis:
    image: redis:7-alpine
    container_name: users-redis
    ports:
      - "6379:6379"
    command: redis-server # no password required on local environment
    volumes:
      - /redis-data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
