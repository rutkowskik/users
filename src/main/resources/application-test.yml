# ============================================
# TEST PROFILE - Staging/Testing Environment
# Usage: --spring.profiles.active=test
# ============================================

spring:
  # Database - Test environment PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-test.internal:5432/users_test}
    username: ${SPRING_DATASOURCE_USERNAME:users_app_test}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA - No SQL logging in test
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Validate schema, don't auto-create
    properties:
      hibernate:
        format_sql: false
  
  # Redis - Test environment Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-test.internal}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

# Server configuration
server:
  port: ${SERVER_PORT:8081}

# JWT - Use environment variable
jwt:
  secret: ${JWT_SECRET}

# Logging - Balanced for testing
logging:
  level:
    root: INFO
    pl.krutkowski.users: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.springframework.data.redis: INFO

# Actuator - Limited exposure
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# CORS - Specific test frontend URL
cors:
  allowed-origins: https://test.yourdomain.com,https://staging.yourdomain.com
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,Accept
  allow-credentials: true
