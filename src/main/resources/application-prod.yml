# ============================================
# PRODUCTION PROFILE
# Usage: --spring.profiles.active=prod
# ============================================

spring:
  # Database - Production PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA - Production optimized
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # NEVER auto-create in production!
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  
  # Redis - Production Redis cluster
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

# Server configuration
server:
  port: ${SERVER_PORT:8081}
  # Security headers
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# JWT - MUST be provided via environment variable
jwt:
  secret: ${JWT_SECRET}

# Logging - Production level
logging:
  level:
    root: WARN
    pl.krutkowski.users: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.springframework.data.redis: WARN

# Actuator - Minimal exposure
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never  # Hide details for security

# CORS - Production domain only
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,Accept
  allow-credentials: true
