apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-backend
  namespace: users-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-backend
  template:
    metadata:
      labels:
        app: users-backend
    spec:
      containers:
        - name: backend
          image: kacperroot/users-backend:20251031-103210
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: users-config
            - secretRef:
                name: users-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: users-app
spec:
  selector:
    app: users-backend
  ports:
    - port: 8081
      targetPort: 8080