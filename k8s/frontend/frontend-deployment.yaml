apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-frontend
  namespace: users-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-frontend
  template:
    metadata:
      labels:
        app: users-frontend
    spec:
      containers:
        - name: frontend
          image: kacperroot/users-frontend:20251111-074012
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: users-app
spec:
  selector:
    app: users-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP