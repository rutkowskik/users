apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: users-frontend-hpa
  namespace: users-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75